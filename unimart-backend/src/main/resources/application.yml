server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: unimart-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}
  datasource:
    url: jdbc:h2:mem:unimart_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  expiration-ms: 86400000 # 24 hours in milliseconds

logging:
  level:
    root: INFO
    lk.ac.kln.unimart: DEBUG
